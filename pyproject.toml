[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickclip"
version = "0.1.0"
description = "Instant Windows screen capture, quick-trim, and export utility."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dxgi = [
    "dxcam>=0.3",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
